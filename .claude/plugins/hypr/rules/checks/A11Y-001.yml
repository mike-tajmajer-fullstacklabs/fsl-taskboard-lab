id: A11Y-001
language: tsx
severity: error
message: "Use <button> for clickable actions, not <div>/<span> with onClick (WCAG 4.1.2)"
note: A match is a violation. Enforces Hypr rule A11Y-001 for .tsx. See A11Y-001-jsx for .jsx.
rule:
  any:
    - kind: jsx_opening_element
    - kind: jsx_self_closing_element
  all:
    - has: { field: name, regex: '^(div|span)$' }
    - has:
        kind: jsx_attribute
        has: { kind: property_identifier, regex: '^onClick$' }
