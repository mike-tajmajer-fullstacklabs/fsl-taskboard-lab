id: A11Y-020-jsx
language: javascript
severity: error
message: "All <img> must have an alt attribute (WCAG 1.1.1)"
note: A match is a violation. Enforces Hypr rule A11Y-020 for .jsx/.js (the prefix A11Y-020 is the join).
rule:
  any:
    - kind: jsx_self_closing_element
    - kind: jsx_opening_element
  has: { field: name, regex: '^img$' }
  not:
    has:
      kind: jsx_attribute
      has: { kind: property_identifier, regex: '^alt$' }
